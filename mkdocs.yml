# Update site_name, site_url, repo_url, and repo_name for each new repository.
site_name: Microsoft Entra Setup and Overview Hub
site_description: Detailed setup and operations guidance for Microsoft Entra across cloud-only and hybrid environments.
site_url: https://cloud2br-msftlearninghub.github.io/Entra-Overview/
repo_url: https://github.com/Cloud2BR-MSFTLearningHub/Entra-Overview
repo_name: Cloud2BR-MSFTLearningHub/Entra-Overview
docs_dir: docs
site_dir: site
copyright: Copyright &copy; 2026 <a href="https://github.com/Cloud2BR-MSFTLearningHub" target="_blank" rel="noopener">Cloud2BR OSS - Learning Hub</a>
theme:
  name: material
  logo: https://avatars.githubusercontent.com/u/195347873?v=4
  favicon: https://avatars.githubusercontent.com/u/195347873?v=4
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    scheme: default
    primary: blue
    accent: blue
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
extra_css:
  - assets/css/custom.css
extra_javascript:
  - assets/js/logo-link.js
  - assets/js/external-links.js
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Cloud2BR-MSFTLearningHub
      name: Cloud2BR OSS - Learning Hub
nav:
  - Home: index.md
  - Overview: overview.md
  - Foundation:
    - Architecture and Product Family: foundation/architecture-and-product-family.md
    - Licensing and Prerequisites: foundation/licensing-and-prerequisites.md
    - Hybrid Identity Design: foundation/hybrid-identity-design.md
  - Secure:
    - Conditional Access and Authentication: secure/conditional-access-and-authentication.md
    - Privileged Access and Role Governance: secure/privileged-access-and-rbac.md
    - External and Workload Identities: secure/external-and-workload-identities.md
  - Implementation:
    - Tenant Setup and Baseline: implementation/tenant-setup-and-baseline.md
    - Applications and Single Sign-On: implementation/applications-and-single-sign-on.md
    - Devices and Identity Signals: implementation/devices-and-identity-signals.md
  - Governance:
    - Identity Governance and Lifecycle: govern/identity-governance-and-lifecycle.md
    - Access Reviews and Entitlement Management: govern/access-reviews-and-entitlement.md
  - Operations:
    - Monitoring, Reporting, and Health: operations/monitoring-and-health.md
    - Pilot Rollout and Change Management: operations/pilot-rollout-and-change.md
